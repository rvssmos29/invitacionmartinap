<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutorial para ser burrita</title>
    <style>
        body {
            text-align: center;
            background-color: rgb(243, 27, 63);
            font-family: Arial, sans-serif;
        }
        .container {
            margin-top: 50px;
        }
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 50px; /* Espacio entre los botones */
            margin-top: 20px;
            position: relative;
        }
        .btn {
            font-size: 18px;
            padding: 10px 20px;
            cursor: pointer;
        }
        #noBtn {
            position: relative;
            transition: 0.3s ease-in-out; /* Suaviza el movimiento */
        }
        #gif-respuesta {
            display: none; /* Oculto por defecto */
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>¿Quieres ser mi San Valentín Burrita? 💖</h2>
        <img src="https://media1.tenor.com/m/_YAb7kOk_88AAAAd/happy-birthday.gif" alt="Gif pregunta" width="250">
        
        <div class="btn-container">
            <button class="btn" onclick="decirSi()">Sí 💘</button>
            <button class="btn" id="noBtn" onmouseover="moverNo()" ontouchstart="moverNo()">Ya kisieras que no  💔</button>

        </div>

        <p id="respuesta" style="font-size: 20px;"></p>
        <div id="gif-respuesta">
            <img src="https://media1.tenor.com/m/cZep90gIRu4AAAAC/ronaldo.gif" alt="Gif de respuesta" width="250">
        </div>
    </div>

    <script>
        function decirSi() {
    document.getElementById("respuesta").innerText = "¡Menos mal burra :), nose si llegue el 14 pero salimos despues ya? TE KIERO MUCHO 😭😭! 💖";
    document.getElementById("gif-respuesta").style.display = "block";
    
    // Ocultar ambos botones
    document.getElementsByClassName("btn")[0].style.display = "none"; // Botón "Sí"
    document.getElementById("noBtn").style.display = "none"; // Botón "No"
}


        function moverNo() {
            let noBtn = document.getElementById("noBtn");

            // Definir un rango de movimiento un poco más grande (máx. 150px en cualquier dirección)
            let offsetX = (Math.random() * 400 - 250); // Movimiento de -75px a 75px
            let offsetY = (Math.random() * 400 - 250); 

            // Aplicar el movimiento limitado
            noBtn.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
        }
    </script>
</body>
</html>
